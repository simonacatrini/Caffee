<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Caffea</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; background: #f2e8dc; color: #302119; font: 16px/1.5 system-ui, sans-serif; }
        main { max-width: 520px; margin: 16px auto; background: #fff; border-radius: 16px; padding: clamp(20px, 5vw, 36px); }
        a { color: #694830; }
        h1 { margin-bottom: 0; }
        h2 { font-size: 1.2rem; }
        label { display: block; margin-top: 14px; }
        input { display: block; width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #826a58; border-radius: 6px; font: inherit; }
        .card-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { margin-top: 20px; background: #694830; color: white; padding: 10px 16px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    </style>
    <script src="./prices.js" defer></script>
    <script src="./checkout.js" defer></script>
</head>
<body>
    <main>
        <a href="./index.html">Back to menu</a>
        <h1>Checkout</h1>
        <h2>Order summary</h2>
        <ul id="checkout-items"></ul>
        <p id="checkout-total" hidden><strong>Total: <span id="checkout-amount"></span></strong></p>
        <p id="checkout-empty" hidden>Your cart is empty.</p>
        <form id="payment-form" autocomplete="off" hidden>
            <h2>Card details</h2>
            <p>Demo checkout. Use fictional details only. No payment will be processed.</p>
            <label>Cardholder name <input type="text" placeholder="Alex Taylor" maxlength="100" required></label>
            <label>Card number <input type="text" inputmode="numeric" placeholder="4242424242424242" pattern="[0-9]{13,19}" maxlength="19" required></label>
            <div class="card-details">
                <label>Expiration date <input type="text" inputmode="text" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" required></label>
                <label>Security code <input type="password" inputmode="numeric" placeholder="123" pattern="[0-9]{3,4}" maxlength="4" required></label>
            </div>
            <button type="submit">Simulate payment</button>
        </form>
        <p id="payment-status" role="status"></p>
    </main>
</body>
</html>
